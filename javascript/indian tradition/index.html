<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indian Tradition Navbar</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #f3d8b6;
            padding: 12px 30px;
        }

        .nav-left a {
            margin-right: 15px;
            text-decoration: none;
            color: #000;
            font-weight: bold;
            font-size: 18px;
        }

        .nav-center {
            font-size: 22px;
            font-weight: bold;
            color: #8b0000;
        }

        .nav-right input[type="text"] {
            padding: 5px 10px;
            font-size: 16px;
            border-radius: 5px;
            border: 1px solid #888;
        }
    </style>
</head>
<body>

    <nav>
 
        <div class="nav-left">
            <a href="#">Home</a>
            <a href="#">About</a>
        </div>

        <div class="nav-center">Indian Tradition</div>

        <div class="nav-right">
            <input type="text" placeholder="Search...">
        </div>
    </nav>

</body>
</html>
